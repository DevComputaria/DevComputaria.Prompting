name: release-governance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      base-ref:
        description: Git ref used as the governance comparison baseline
        required: true
      semver-impact:
        description: Declared release impact
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: semver-and-immutability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve declared impact and base ref
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BASE_REF: ${{ inputs['base-ref'] }}
          INPUT_IMPACT: ${{ inputs['semver-impact'] }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t semver_labels < <(jq -r '.[] | select(test("^semver:(patch|minor|major)$"))' <<< "$LABELS_JSON")
            if [[ "${#semver_labels[@]}" -ne 1 ]]; then
              echo "Exactly one semver:patch, semver:minor, or semver:major label is required." >&2
              exit 1
            fi
            echo "impact=${semver_labels[0]#semver:}" >> "$GITHUB_OUTPUT"
            echo "base=origin/$PR_BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "impact=$INPUT_IMPACT" >> "$GITHUB_OUTPUT"
            echo "base=$INPUT_BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            tools/DevComputaria.Prompts.Cli/DevComputaria.Prompts.Cli.csproj

      - name: Restore release tooling
        run: dotnet restore tools/DevComputaria.Prompts.Cli/DevComputaria.Prompts.Cli.csproj

      - name: Validate release impact
        run: >-
          dotnet run --project tools/DevComputaria.Prompts.Cli
          --configuration Release --no-restore --
          release-check --base "${{ steps.release.outputs.base }}"
          --impact "${{ steps.release.outputs.impact }}"
