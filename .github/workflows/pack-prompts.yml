name: pack-prompts

on:
  workflow_call:
    inputs:
      base-ref:
        required: true
        type: string
      previous-version:
        required: false
        type: string
      package-version:
        required: true
        type: string
      semver-impact:
        required: true
        type: string
      create-tag:
        required: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  pack:
    name: pack prompts
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/DevComputaria.PromptKit/DevComputaria.PromptKit.csproj
            src/DevComputaria.Prompts/DevComputaria.Prompts.csproj

      - name: Restore package dependencies
        run: dotnet restore tools/DevComputaria.Prompts.Cli/DevComputaria.Prompts.Cli.csproj

      - name: Validate release version and impact
        if: inputs['previous-version'] != ''
        run: >-
          dotnet run --project tools/DevComputaria.Prompts.Cli
          --configuration Release --no-restore --
          release-check --base "${{ inputs['base-ref'] }}"
          --impact "${{ inputs['semver-impact'] }}"
          --previous-version "${{ inputs['previous-version'] }}"
          --next-version "${{ inputs['package-version'] }}"

      - name: Validate initial release impact
        if: inputs['previous-version'] == ''
        run: >-
          dotnet run --project tools/DevComputaria.Prompts.Cli
          --configuration Release --no-restore --
          release-check --base "${{ inputs['base-ref'] }}"
          --impact "${{ inputs['semver-impact'] }}"

      - name: Pack validated catalog
        run: >-
          dotnet pack src/DevComputaria.Prompts/DevComputaria.Prompts.csproj
          --configuration Release --no-restore --output artifacts
          -p:PackageVersion="${{ inputs['package-version'] }}"
          -p:RepositoryUrl="${{ github.server_url }}/${{ github.repository }}"
          -p:RepositoryType=git
          -p:PublishRepositoryUrl=true
          -p:ContinuousIntegrationBuild=true

      - name: Publish package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevComputaria.Prompts-${{ inputs['package-version'] }}-${{ github.sha }}
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: Publish package to GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "$NUGET_AUTH_TOKEN"
          --skip-duplicate

      - name: Tag published commit
        if: inputs['create-tag']
        env:
          PACKAGE_VERSION: ${{ inputs['package-version'] }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "v$PACKAGE_VERSION" --message "Release v$PACKAGE_VERSION"
          git push origin "v$PACKAGE_VERSION"
