name: validate-prompts

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-prompts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: prompt-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore DevComputaria.Prompting.sln

      - name: Build solution
        run: dotnet build DevComputaria.Prompting.sln --configuration Release --no-restore

      - name: Validate repository contract with CLI
        run: dotnet run --project tools/DevComputaria.Prompts.Cli --configuration Release --no-build -- validate

      - name: Test manifest and packed-resource consistency
        run: >-
          dotnet test tests/DevComputaria.Prompts.Tests/DevComputaria.Prompts.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Test schemas, immutability and render fixtures
        run: >-
          dotnet test tests/DevComputaria.Prompts.Contract.Tests/DevComputaria.Prompts.Contract.Tests.csproj
          --configuration Release --no-build --no-restore

      - name: Test CLI exit codes and diagnostics
        run: >-
          dotnet test tests/DevComputaria.Prompts.Cli.Tests/DevComputaria.Prompts.Cli.Tests.csproj
          --configuration Release --no-build --no-restore
